rules:
  - id: broken-symlinks
    title: Broken symbolic links

    triggers:
      - name: broken
        pipeline:
          - [find, /etc, /usr/lib, /var/lib, -xtype, l]
        transform: "$stdout | lines | non_empty"

    values:
      broken_count: "$broken | count"
      broken_list: "$broken | join(', ')"

    conditions:
      - warning: "$broken"

    outcome:
      id: broken-symlinks
      title: "{broken_count} broken symbolic link(s) found"
      description: >
        The following symlinks point to non-existent targets: {broken_list}.
        Broken symlinks can hide misconfigured packages or removed services.
      remediation:
        description: "After verifying a link is broken and no longer needed, replace the placeholder with that link's path and run the command once per link."
        commands:
          - 'sudo rm -- "/path/to/confirmed-broken-symlink"'

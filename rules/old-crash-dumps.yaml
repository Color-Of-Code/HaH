rules:
  - id: old-crash-dumps
    title: Old crash dumps and core files
    triggers:
      - name: old_files
        capability:
          type: old_files
          paths: []
          older_than_days: 30
    conditions:
      - info: "$old_files"
    outcome:
      for_each:
        list: "$old_files"
        as: file
      id: "crash-dump-{file}"
      title: "Old crash dump: {file}"
      description: "{file} is older than 30 days and can likely be removed."
      remediation:
        description: Remove old crash dump.
        commands:
          - "sudo rm {file}"

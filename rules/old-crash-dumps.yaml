rules:
  - id: old-crash-dumps
    title: Old crash dumps and core files
    triggers:
      - name: old_files
        pipeline:
          - [find, /var/crash, /var/lib/systemd/coredump, -mtime, "+30", -type, f]
        transform: "$stdout | lines | non_empty"
    conditions:
      - info: "$old_files"
    outcome:
      for_each:
        list: "$old_files"
        as: file
      id: "crash-dump-{file}"
      title: "Old crash dump: {file}"
      description: "{file} is older than 30 days and can likely be removed."
      remediation:
        description: Remove old crash dump.
        commands:
          - "sudo rm {file}"

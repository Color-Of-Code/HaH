rules:
  - id: legacy-network-interfaces
    title: Legacy /etc/network/interfaces configuration

    only_if:
      require_files:
        - /etc/network/interfaces

    triggers:
      - name: iface_lines
        pipeline:
          - [grep, -Es, "^(auto|iface) ", /etc/network/interfaces]
        transform: "$stdout | lines | reject_grep(' lo\\b')"
      - name: netplan_files
        pipeline:
          - [ls, -A, /etc/netplan]
        transform: "$stdout | lines | non_empty"
      - name: nm_active
        probe:
          type: service_active
          name: NetworkManager

    values:
      non_lo_count: "$iface_lines | count"
      netplan_count: "$netplan_files | count"

    conditions:
      - all:
          - warning: "$non_lo_count > 0"
          - any:
              - warning: "$netplan_count > 0"
              - warning: "$nm_active == true"
      - all:
          - info: "$non_lo_count > 0"
          - info: "$netplan_count == 0"
          - info: "$nm_active == false"

    outcome:
      id: legacy-network-interfaces
      title: "/etc/network/interfaces has non-loopback entries"
      description: >-
        /etc/network/interfaces defines non-loopback interface(s) using the
        legacy ifupdown format. Consider migrating to Netplan or NetworkManager.
      remediation:
        description: "Migrate interface configuration to Netplan or NetworkManager."
        commands:
          - "# Netplan reference: https://netplan.readthedocs.io/"
          - "# After migration: sudo apt remove --purge ifupdown"

rules:
  - id: unused-kernels
    title: Unused installed kernels

    only_if:
      distro_family: debian

    triggers:
      - name: running
        command:
          program: uname
          args: ["-r"]
        transform: "$stdout | trim"
      - name: bootloader_config
        command:
          program: cat
          args: ["/boot/grub/grub.cfg"]
        transform: "$stdout | lines"
      - name: installed
        pipeline:
          - [dpkg-query, --show, "--showformat=${Package}\n", "linux-image-*"]
        transform: "$stdout | lines | non_empty"

    values:
      bootable_kernels: "$bootloader_config | grep('vmlinuz-[^ ]+') | prefix_strip('vmlinuz-') | prefix_add('linux-image-') | sort"
      unused_kernels: "$installed | reject_in($bootable_kernels) | reject_contains($running) | sort"
      unused_count: "$unused_kernels | count"
      unused_list: "$unused_kernels | join(', ')"

    conditions:
      - warning: "$unused_kernels"

    outcome:
      id: unused-kernels
      title: "{unused_count} unused kernel package(s) installed"
      description: >
        These kernel packages are installed but do not match the running kernel
        and can be safely removed: {unused_list}.
        They consume space in /boot and can be removed with apt autoremove.
      remediation:
        description: "Remove unused kernels with apt."
        commands:
          - "sudo apt autoremove --purge"

rules:
  - id: unused-kernels
    title: Unused installed kernels

    only_if:
      distro_family: debian

    triggers:
      - name: running
        command:
          program: uname
          args: ["-r"]
        transform: "$stdout | trim"
      - name: bootable
        file:
          path: /boot/grub/grub.cfg
        transform: "$stdout | lines | grep('vmlinuz-[^ ]+') | field(1) | prefix_strip('/boot/vmlinuz-') | prefix_add('linux-image-') | unique | regex_escape"
      - name: installed
        pipeline:
          - [dpkg-query, -W, "-f=${Package}\n"]
        transform: "$stdout | lines | grep('^linux-image-[^ ]+$') | non_empty"

    values:
      unused_kernels: "$installed | reject_grep($bootable) | reject_contains($running) | reject_grep('^linux-image-generic$') | sort"

    conditions:
      - warning: "$unused_kernels"

    outcome:
      for_each:
        list: "$unused_kernels"
        as: ver
      id: "unused-kernels-{ver}"
      title: "Unused kernel package: {ver}"
      description: "{ver} is installed but does not match the running kernel and can be removed."
      remediation:
        description: "Remove unused kernels with apt."
        commands:
          - "sudo apt autoremove --purge {ver}"

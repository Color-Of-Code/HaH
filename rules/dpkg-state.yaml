rules:
  - id: dpkg-state
    title: Broken dpkg package states

    only_if:
      distro_family: debian
      require_commands:
        - dpkg

    triggers:
      - name: audit_output
        command:
          program: dpkg
          args: ["--audit"]

    conditions:
      - critical: "$audit_output | trim"

    outcome:
      id: dpkg-audit
      title: "dpkg audit reports package state problems"
      description: "{audit_output}"
      remediation:
        description: "Attempt to fix broken packages."
        commands:
          - "sudo dpkg --configure -a"
          - "sudo apt-get install -f"

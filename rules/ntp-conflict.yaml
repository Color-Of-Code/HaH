rules:
  - id: ntp-conflict
    title: Multiple NTP services active simultaneously

    only_if:
      require_commands:
        - systemctl

    triggers:
      - name: active_ntp
        pipeline:
          - [systemctl, is-active, ntp, chrony, openntpd, systemd-timesyncd]
        transform: "$stdout | lines | grep('^active$')"

    values:
      ntp_count: "$active_ntp | count"
    conditions:
      - warning: "$ntp_count > 1"
    outcome:
      id: ntp-conflict
      title: "Multiple NTP services active ({ntp_count})"
      description: >-
        More than one time-sync service (of ntp, chrony, openntpd,
        systemd-timesyncd) is active. Competing daemons can fight over the
        system clock and cause time jumps, log timestamp corruption, or TLS
        certificate errors.
      remediation:
        description: "Disable all but one NTP service (chrony is recommended)."
        commands:
          - "sudo systemctl disable --now ntp"
          - "sudo systemctl disable --now openntpd"
          - "sudo systemctl disable --now systemd-timesyncd"
          - "# Then enable only one: sudo systemctl enable --now chrony"

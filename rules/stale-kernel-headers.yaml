rules:
  - id: stale-kernel-headers
    title: Stale kernel header packages

    only_if:
      distro_family: debian

    triggers:
      - name: running
        command:
          program: uname
          args: ["-r"]
        transform: "$stdout | trim"
      - name: bootable
        file:
          path: /boot/grub/grub.cfg
        transform: "$stdout | lines | grep('vmlinuz-[^ ]+') | field(1) | prefix_strip('/boot/vmlinuz-') | suffix_strip('-generic') | unique | regex_escape"
      - name: headers
        pipeline:
          - [dpkg-query, -W, "-f=${Package}\n"]
        transform: "$stdout | lines | grep('^linux-headers-[^ ]+$') | non_empty"

    values:
      stale_headers: "$headers | reject_grep($bootable) | reject_contains($running) | reject_grep('^linux-headers-generic$') | sort"
    conditions:
      - info: "$stale_headers"

    outcome:
      for_each:
        list: "$stale_headers"
        as: ver
      id: "stale-kernel-headers-{ver}"
      title: "Stale kernel header: {ver}"
      description: "{ver} has no matching linux-image package installed."
      remediation:
        description: "Remove stale kernel header packages."
        commands:
          - "sudo apt autoremove --purge {ver}"

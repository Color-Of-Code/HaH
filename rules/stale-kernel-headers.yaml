rules:
  - id: stale-kernel-headers
    title: Stale kernel header packages

    only_if:
      distro_family: debian

    triggers:
      - name: running
        command:
          program: uname
          args: ["-r"]
        transform: "$stdout | trim"
      - name: bootloader_config
        command:
          program: cat
          args: ["/boot/grub/grub.cfg"]
        transform: "$stdout | lines"
      - name: headers
        pipeline:
          - [dpkg-query, --show, "--showformat=${Package}\n", "linux-headers-*"]
        transform: "$stdout | lines | non_empty"

    values:
      bootable_header_packages: "$bootloader_config | grep('vmlinuz-[^ ]+') | prefix_strip('vmlinuz-') | prefix_add('linux-headers-') | sort"
      stale_headers: "$headers | reject_in($bootable_header_packages) | reject_contains($running) | sort"
      stale_versions: "$stale_headers | prefix_strip('linux-headers-')"
      stale_count: "$stale_versions | count"
      stale_list: "$stale_versions | join(', ')"

    conditions:
      - info: "$stale_versions"

    outcome:
      for_each:
        list: "$stale_versions"
        as: ver
      id: "stale-kernel-headers-{ver}"
      title: "Stale kernel header: linux-headers-{ver}"
      description: "linux-headers-{ver} has no matching linux-image package installed."
      remediation:
        description: "Remove stale kernel header packages."
        commands:
          - "sudo apt autoremove --purge"

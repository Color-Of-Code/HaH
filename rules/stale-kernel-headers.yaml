rules:
  - id: stale-kernel-headers
    title: Stale kernel header packages

    only_if:
      distro_family: debian

    triggers:
      - name: headers
        pipeline:
          - [dpkg-query, --show, "--showformat=${Package}\n", "linux-headers-*"]
        transform: "$stdout | lines | non_empty"
      - name: images
        pipeline:
          - [dpkg-query, --show, "--showformat=${Package}\n", "linux-image-*"]
        transform: "$stdout | lines | non_empty"

    values:
      header_versions: "$headers | prefix_strip('linux-headers-') | grep('^[0-9]')"
      image_versions: "$images | prefix_strip('linux-image-')"
      stale_versions: "$header_versions | reject_in($image_versions) | sort"
      stale_count: "$stale_versions | count"
      stale_list: "$stale_versions | join(', ')"

    conditions:
      - info: "$stale_versions"

    outcome:
      for_each:
        list: "$stale_versions"
        as: ver
      id: "stale-kernel-headers-{ver}"
      title: "Stale kernel header: linux-headers-{ver}"
      description: "linux-headers-{ver} has no matching linux-image package installed."
      remediation:
        description: "Remove stale kernel header packages."
        commands:
          - "sudo apt autoremove --purge"

rules:
  - id: user-denylist
    title: Packages matching user denylist

    only_if:
      distro_family: debian

    triggers:
      - name: installed
        pipeline:
          - [dpkg-query, -W, "-f=${Package}\n"]
        transform: "$stdout | lines | non_empty"

    values:
      denied: "$installed | intersect($config.denylist.packages) | sort"

    conditions:
      - warning: "$denied"

    outcome:
      for_each:
        list: "$denied"
        as: entry
      id: "user-denylist-{entry}"
      title: "Denylisted package installed: {entry}"
      description: >-
        A package from the configured denylist is installed: {entry}.
      remediation:
        description: "Remove the denylisted package."
        commands:
          - "sudo apt remove --purge <package>"

rules:
  - id: initramfs-size
    title: Oversized initramfs images
    triggers:
      - name: large_images
        capability:
          type: large_initramfs
          threshold_mb: 100
    conditions:
      - warning: "$large_images"
    outcome:
      for_each:
        list: "$large_images"
        as: entry
      finding_id: "initramfs-large-{entry}"
      title: "Oversized initramfs: {entry} MB"
      description: >-
        initramfs image {entry} exceeds the threshold.
        Large images slow boot and consume /boot space.
      remediation:
        description: Regenerate initramfs images.
        commands:
          - "sudo update-initramfs -u -k all"

rules:
  - id: initramfs-size
    title: Oversized initramfs images
    triggers:
      - name: large_images
        pipeline:
          - [find, /boot, "(", -name, "initrd.img-*", -o, -name, "initramfs-*", ")", -size, "+100M", -printf, "%f\n"]
        transform: "$stdout | lines | non_empty"
    conditions:
      - warning: "$large_images"
    outcome:
      for_each:
        list: "$large_images"
        as: entry
      id: "initramfs-large-{entry}"
      title: "Oversized initramfs: {entry}"
      description: >-
        initramfs image {entry} exceeds 100 MB.
        Large images slow boot and consume /boot space.
      remediation:
        description: Regenerate initramfs images.
        commands:
          - "sudo update-initramfs -u -k all"

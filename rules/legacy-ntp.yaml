blocks:
  guards:
    debian_ntp:
      distro_family: debian

  outcomes:
    ntp_remediation:
      remediation:
        description: "Remove ntp and enable a modern time-sync service."
        commands:
          - "sudo apt remove --purge ntp"
          - "sudo apt install chrony && sudo systemctl enable --now chrony"

rules:
  # Warning: ntp is installed AND a modern time-sync service is also active.
  # Both daemons compete to adjust the system clock.
  - id: legacy-ntp-conflict
    title: Legacy NTP daemon conflicts with active time-sync service

    use:
      guard: debian_ntp
      outcome: ntp_remediation

    triggers:
      - name: ntp_installed
        probe:
          type: package_installed
          name: ntp
      - name: chrony_active
        probe:
          type: service_active
          name: chrony
      - name: timesyncd_active
        probe:
          type: service_active
          name: systemd-timesyncd

    conditions:
      - type: all
        severity: Warning
        conditions:
          - warning: "$ntp_installed == true"
          - type: any
            severity: Warning
            conditions:
              - warning: "$chrony_active == true"
              - warning: "$timesyncd_active == true"

    outcome:
      finding_id: legacy-ntp
      title: "Legacy ntp package is installed alongside an active time-sync service"
      description: >
        The legacy ntp (ISC ntpd) package is installed while a modern time-sync
        service is also active. Multiple time-sync daemons compete to adjust the
        system clock, which can cause instability. Remove the ntp package.

  # Info: ntp is installed but no modern time-sync alternative is active.
  - id: legacy-ntp
    title: Legacy NTP daemon (ntpd / ISC ntp)

    use:
      guard: debian_ntp
      outcome: ntp_remediation

    triggers:
      - name: ntp_installed
        probe:
          type: package_installed
          name: ntp
      - name: chrony_active
        probe:
          type: service_active
          name: chrony
      - name: timesyncd_active
        probe:
          type: service_active
          name: systemd-timesyncd

    conditions:
      - type: all
        severity: Info
        conditions:
          - info: "$ntp_installed == true"
          - info: "$chrony_active != true"
          - info: "$timesyncd_active != true"

    outcome:
      finding_id: legacy-ntp
      title: "Legacy ntp (ISC ntpd) package is installed"
      description: >
        The legacy ntp (ISC ntpd) package is installed. Modern alternatives
        such as chrony (recommended for servers and VMs) or systemd-timesyncd
        offer better accuracy, NTS/DNSSEC support, and resilience to large
        clock jumps.

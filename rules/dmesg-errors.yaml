rules:
  - id: dmesg-errors
    title: Kernel ring buffer errors and warnings
    only_if:
      require_commands: [dmesg]
    triggers:
      - name: dmesg_critical
        pipeline:
          - [dmesg, --level=emerg,alert,crit,err]
        transform: "$stdout | lines | grep('(?i)(fatal|bug:|oops|panic|call trace|kernel BUG|error)')"
      - name: dmesg_warnings
        pipeline:
          - [dmesg, --level=warn]
        transform: "$stdout | lines | grep('(?i)warn(ing)?')"
    values:
      critical_count: "$dmesg_critical | count"
      warning_count: "$dmesg_warnings | count"
      critical_sample: "$dmesg_critical | first"
      warning_sample: "$dmesg_warnings | first"
    conditions:
      - critical: "$dmesg_critical"
      - warning: "$dmesg_warnings"
    outcome:
      id: dmesg-errors
      title: "Kernel ring buffer: {critical_count} critical, {warning_count} warning message(s)"
      description: >
        The kernel ring buffer contains messages that may indicate hardware or
        driver problems.
        First critical: {critical_sample}
        First warning: {warning_sample}
      remediation:
        description: "Inspect the full kernel ring buffer."
        commands:
          - "dmesg --level=emerg,alert,crit,err,warn"

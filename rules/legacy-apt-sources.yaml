rules:
  - id: legacy-sources-format
    title: Legacy one-line APT source entries

    only_if:
      distro_family: debian

    triggers:
      - name: legacy_files
        capability:
          type: legacy_apt_sources

    conditions:
      - info: "$legacy_files"

    outcome:
      for_each:
        list: "$legacy_files"
        as: file
      finding_id: "legacy-sources-format-{{ file }}"
      title: "Legacy one-line APT source: {{ file }}"
      description: >-
        {{ file }} uses the deprecated one-line `deb` format.
        The modern DEB822 `.sources` format is preferred.
      remediation:
        description: "Convert to DEB822 format (one .sources file per repository)."
        commands:
          - "# See: https://wiki.debian.org/SourcesList#DEB822_format"

# Example rule: broken symbolic links
#
# Demonstrates the BrokenSymlinks capability, which walks /etc, /usr/lib,
# and /var/lib (or caller-supplied paths) and returns a list of dangling
# symlink paths.
#
# The built-in BrokenSymlinksCheck already covers this — this file exists to
# show how a list-returning capability feeds into non_empty / count conditions.
#
# Copy to /etc/hah/rules.d/ or ~/.config/hah/rules.d/ to activate.

rules:
  - id: broken-symlinks-dsl
    title: Broken symbolic links (DSL example)

    # The capability defaults to scanning /etc, /usr/lib, and /var/lib.
    # Supply an explicit `paths` list to narrow the scan.
    triggers:
      - name: broken
        capability:
          type: broken_symlinks
          paths: []

    values:
      broken_count: "$broken | count"
      broken_list: "$broken | join(', ')"

    conditions:
      - type: non_empty
        value: "$broken"
        severity: Warning

    outcome:
      finding_id: broken-symlinks-dsl
      title: "{broken_count} broken symbolic link(s) found"
      description: >
        The following symlinks point to non-existent targets:
        {broken_list}.
        Broken symlinks can hide misconfigured packages or removed services.
      remediation:
        description: "Remove each broken symlink after verifying it is no longer needed."
        commands:
          - "sudo find /etc /usr/lib /var/lib -xtype l -delete"
        safe: false

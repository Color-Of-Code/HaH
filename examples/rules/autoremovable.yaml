# Example rule: auto-removable packages
#
# Demonstrates the HaH declarative DSL using a command trigger with a
# starts_with filter to count actionable lines from apt-get output.
#
# The built-in AutoremovableCheck already covers this — this file is here
# to show how a count-based command rule looks in the DSL.
#
# Copy to /etc/hah/rules.d/ or ~/.config/hah/rules.d/ to activate.

rules:
  - id: autoremovable-dsl
    title: Auto-removable packages (DSL example)

    only_if:
      distro_family: debian
      require_commands:
        - apt-get

    # Run apt-get in dry-run mode so nothing is changed.
    triggers:
      - name: autoremove_output
        command:
          program: apt-get
          args: ["--dry-run", "autoremove"]

    # Count the "Remv <pkg>" lines emitted by apt-get dry-run.
    values:
      autoremovable_count: "$autoremove_output | lines | starts_with('Remv ') | count"

    # Fire an Info finding whenever at least one package can be removed.
    conditions:
      - type: numeric_threshold
        value: "$autoremovable_count"
        operator: gt
        threshold: "0"
        severity: Info

    outcome:
      finding_id: autoremovable-dsl
      title: "{autoremovable_count} auto-removable package(s)"
      description: >
        {autoremovable_count} package(s) are no longer needed and can be
        removed automatically.  Run `sudo apt autoremove --purge` to clean
        them up and reclaim disk space.
      remediation:
        description: "Remove unused auto-installed packages."
        commands:
          - "sudo apt autoremove --purge"
        safe: false

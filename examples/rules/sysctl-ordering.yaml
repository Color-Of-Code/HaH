# Example rule: conflicting sysctl.d overrides
#
# Demonstrates the SysctlConflicts capability, which reads *.conf files from
# /usr/lib/sysctl.d, /etc/sysctl.d, and /run/sysctl.d (or caller-supplied
# paths) and returns a list of keys that appear with different values in
# multiple files.
#
# The built-in SysctlOrderingCheck already covers this — this file exists to
# show how a filesystem-only capability feeds a non_empty condition.
#
# Copy to /etc/hah/rules.d/ or ~/.config/hah/rules.d/ to activate.

rules:
  - id: sysctl-ordering-dsl
    title: Conflicting sysctl.d overrides (DSL example)

    # Supply an explicit `paths` list to scan different directories.
    # Leave paths empty to use the defaults:
    #   /usr/lib/sysctl.d, /etc/sysctl.d, /run/sysctl.d
    triggers:
      - name: conflicts
        capability:
          type: sysctl_conflicts
          paths: []

    values:
      conflict_count: "$conflicts | count"
      conflict_list: "$conflicts | join('\n')"

    conditions:
      - type: non_empty
        value: "$conflicts"
        severity: Warning

    outcome:
      finding_id: sysctl-ordering-dsl
      title: "{conflict_count} sysctl key(s) with conflicting values"
      description: >
        The following sysctl keys are set to different values in multiple
        sysctl.d files.  The last file in lexicographic order wins, but the
        conflict indicates possible misconfiguration:

        {conflict_list}

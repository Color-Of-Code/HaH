# Example rule: residual package configuration files
#
# Demonstrates using starts_with + prefix_strip to extract package names from
# dpkg-query output.  The non_empty condition fires when at least one package
# has a residual config state ("rc" in dpkg terminology).
#
# The built-in ResidualConfigCheck already covers this — this file exists to
# show multi-step list transformation in the DSL.
#
# Copy to /etc/hah/rules.d/ or ~/.config/hah/rules.d/ to activate.

rules:
  - id: residual-config-dsl
    title: Residual package configuration files (DSL example)

    only_if:
      distro_family: debian
      require_commands:
        - dpkg-query

    # Query dpkg status for every package.  Each output line has the form:
    #   <status-field> <package-name>
    # e.g. "install ok installed bash" or "deinstall ok config-files foo".
    triggers:
      - name: dpkg_output
        command:
          program: dpkg-query
          args: ["-W", "-f=${Status} ${Package}\n"]

    # Keep only lines for packages in the "config-files" (rc) state, then
    # strip the common status prefix to leave a plain list of package names.
    values:
      rc_packages: >-
        $dpkg_output | lines
        | starts_with('deinstall ok config-files ')
        | prefix_strip('deinstall ok config-files ')
        | non_empty
      rc_count: "$rc_packages | count"
      rc_package_list: "$rc_packages | join(', ')"

    # Fire an Info finding whenever at least one package has residual config.
    conditions:
      - type: non_empty
        value: "$rc_packages"
        severity: Info

    outcome:
      finding_id: residual-config-dsl
      title: "{rc_count} package(s) with residual configuration"
      description: >
        These packages were removed but their configuration files remain on
        disk: {rc_package_list}.  Purging them will clean up /etc and reduce
        confusion during future installs.
      remediation:
        description: "Purge residual configuration files."
        commands:
          - "sudo dpkg --purge {rc_package_list}"
        safe: false

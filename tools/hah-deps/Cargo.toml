[package]
name = "hah-deps"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[workspace]

[[bin]]
name = "hah-deps"
path = "src/main.rs"

[dependencies]
anyhow  = "1.0.104"
clap    = { version = "4.6.7", features = ["derive"] }
serde   = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[package]
name = "hah-dsl"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hah-core = { path = "../hah-core" }
hah-utils = { path = "../hah-utils" }
anyhow = "1.0.104"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
winnow = "1.0.4"

[dev-dependencies]
hah-core = { path = "../hah-core", features = ["mock"] }
mockall = { workspace = true }
tempfile = "3.27.0"

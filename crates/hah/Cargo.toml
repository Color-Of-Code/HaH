[package]
name = "hah"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "hah"
path = "src/main.rs"

[dependencies]
hah-core = { path = "../hah-core" }
hah-dsl = { path = "../hah-dsl" }
hah-utils = { path = "../hah-utils" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
